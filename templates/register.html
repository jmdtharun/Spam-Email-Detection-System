<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpamGuard – Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f1117;
      color: #f1f3f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2e3347;
      border-radius: 18px;
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 44px; height: 44px;
      background: #1e1f4a;
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }

    .logo span { font-size: 22px; font-weight: 700; color: #6366f1; }

    h2 { font-size: 20px; font-weight: 700; color: #f1f3f9; margin-bottom: 6px; }

    .sub { font-size: 14px; color: #8b91a8; margin-bottom: 28px; }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #8b91a8;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: #21253a;
      border: 1px solid #2e3347;
      border-radius: 10px;
      padding: 11px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #f1f3f9;
      outline: none;
      transition: border-color .15s;
    }

    input:focus { border-color: #6366f1; }
    input::placeholder { color: #4b5268; }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }

    .btn:hover { background: #4f52d4; }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
      color: #8b91a8;
    }

    .footer a { color: #a5b4fc; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <span>SpamGuard</span>
  </div>

  <h2>Create account</h2>
  <p class="sub">Start detecting spam emails for free</p>

  <form method="POST">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="John Doe" required />
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a strong password" required />
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>

  <div class="footer">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

</body>
</html>
